# The modules' own rules (docs/architecture.md): each module may use the modules of the tiers below its own, and
# in its own tier only those named, so the modules make no cycle. deptrac.yaml holds the layers inside a module;
# this, the modules among themselves. Shared and Platform are under every module and are not checked here.
#
#   vendor/bin/deptrac analyse --config-file=deptrac.modules.yaml --no-cache
#
# What used a module it should not before the rules came is in deptrac.modules.baseline.yaml, each to be taken out
# (PLAN.md): a new one fails CI. Take an entry out when its import is gone; never add one.
imports:
  - deptrac.modules.baseline.yaml
deptrac:
  paths:
    - ./src
  layers:
    - name: Extension
      collectors:
        - type: directory
          value: 'src/Extension/.*'
    - name: Jobs
      collectors:
        - type: directory
          value: 'src/Jobs/.*'
    - name: Geography
