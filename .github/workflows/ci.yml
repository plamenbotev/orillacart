name: CI

on:
  push:
    branches: [master, rebuild]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Architecture rules
        run: vendor/bin/deptrac analyse --no-progress --fail-on-uncovered
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  admin:
    name: Admin code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm run build

  integration:
    name: Integration and end-to-end (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - run: npx wp-env start
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts/

  opensearch:
    name: Search on OpenSearch (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx wp-env start
      - name: OpenSearch beside the test site
        run: |
          network="$(docker network ls --filter name=wp-env --format '{{.Name}}' | head -n 1)"
          docker run -d --name oc-opensearch --network "$network" -p 9200:9200 \
            -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' \
            opensearchproject/opensearch:2.19.1
          for attempt in $(seq 1 60); do curl -fs http://localhost:9200 > /dev/null && break; sleep 2; done
          curl -fs http://localhost:9200
      - run: npm run test:opensearch

  release:
    name: Release zip
    runs-on: ubuntu-latest
    needs: [php, admin, integration, opensearch]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - name: Build
        run: bin/build
      - name: Install and run it on a clean WordPress
        run: bin/smoke-test-release
      - uses: actions/upload-artifact@v5
        with:
          name: orillacart-zip
          path: dist/*.zip
          if-no-files-found: error
